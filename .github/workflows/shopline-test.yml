name: Shopline API test
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Shopline API
        env:
          TOKEN: ${{ secrets.SHOPLINE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          tok=os.environ.get("TOKEN","")
          H="amplecouture1"; V="v20260301"
          def req(method,url,body=None):
              data=json.dumps(body).encode() if body is not None else None
              r=urllib.request.Request(url,data=data,method=method,headers={
                  "Content-Type":"application/json","Authorization":"Bearer "+tok})
              try:
                  resp=urllib.request.urlopen(r,timeout=30); return resp.status, resp.read().decode()[:600]
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:600]
              except Exception as e: return "ERR", str(e)[:250]
          print("token len",len(tok))
          tests=[
           ("REST orders",       "GET",  f"https://{H}.myshopline.com/admin/openapi/{V}/orders.json?limit=1", None),
           ("REST orders/count", "GET",  f"https://{H}.myshopline.com/admin/openapi/{V}/orders/count.json", None),
           ("REST customers",    "GET",  f"https://{H}.myshopline.com/admin/openapi/{V}/customers.json?limit=1", None),
           ("GQL graphql.json",  "POST", f"https://{H}.myshopline.com/admin/openapi/{V}/graphql.json", {"query":"{ __typename }"}),
           ("GQL graphql",       "POST", f"https://{H}.myshopline.com/admin/openapi/{V}/graphql", {"query":"{ __typename }"}),
           ("GQL root graphql",  "POST", f"https://{H}.myshopline.com/admin/openapi/graphql.json", {"query":"{ __typename }"}),
          ]
          for name,m,url,b in tests:
              s,body=req(m,url,b)
              print(f"\n=== {name} [{m}] -> HTTP {s}")
              print(body)
          PY
