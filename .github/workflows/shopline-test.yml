name: Shopline API test
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Shopline API
        env:
          TOKEN: ${{ secrets.SHOPLINE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          tok=os.environ.get("TOKEN",""); H="amplecouture1"; V="v20260301"
          BASE=f"https://{H}.myshopline.com/admin/openapi/{V}"
          def req(method,url,body=None):
              data=json.dumps(body).encode() if body is not None else None
              r=urllib.request.Request(url,data=data,method=method,headers={"Content-Type":"application/json","Authorization":"Bearer "+tok})
              try:
                  resp=urllib.request.urlopen(r,timeout=30); return resp.status, resp.read().decode()
              except urllib.error.HTTPError as e: return e.code, e.read().decode()
              except Exception as e: return "ERR", str(e)[:200]
          # customer id from an order
          s,b=req("GET",BASE+"/orders.json?limit=1"); cid=None
          try:
              o=json.loads(b)["orders"][0]; c=o.get("customer") or {}; cid=c.get("id") or o.get("customer_id")
          except: pass
          print("order customer id:", cid)
          # customers list
          s,b=req("GET",BASE+"/customers.json?limit=1"); print("\n=== customers list -> HTTP",s); print(b[:1400])
          try:
              cu=json.loads(b)["customers"][0]; print("\nCUSTOMER KEYS:", list(cu.keys()))
              if not cid: cid=cu.get("id")
          except Exception as e: print("cust parse:",e)
          # single customer
          if cid:
              s,b=req("GET",f"{BASE}/customers/{cid}.json"); print(f"\n=== single customer {cid} -> HTTP",s); print(b[:1400])
          # customer groups (tiers may be groups)
          for ep in ["customer_groups.json","customers/groups.json"]:
              s,b=req("GET",f"{BASE}/{ep}"); print(f"\n=== {ep} -> HTTP",s); print(b[:400])
          # graphql memberInfo (tier)
          if cid:
              q={"query":"query{ memberInfo(customerId:\"gid://shopline/Customer/%s\"){ levelName levelCode levelOrder membershipType } }" % cid}
              s,b=req("POST",f"https://{H}.myshopline.com/admin/api/{V}/graphql.json",q); print("\n=== GQL memberInfo (/admin/api) -> HTTP",s); print(b[:500])
          PY
