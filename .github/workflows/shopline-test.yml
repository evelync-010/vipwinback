name: Shopline API test
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Shopline Admin GraphQL API
        env:
          TOKEN: ${{ secrets.SHOPLINE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          tok = os.environ.get("TOKEN","")
          handle = "amplecouture1"
          print("Token present:", bool(tok), "| length:", len(tok), "(value hidden)")
          versions = ["v20251201","v20250901","v20250601","v20250301","v20241201","v20240601","v20231101"]
          query = {"query": "{ __typename }"}
          def call(url):
              data = json.dumps(query).encode()
              req = urllib.request.Request(url, data=data, headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + tok})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  return r.status, r.read().decode()[:400]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]
              except Exception as e:
                  return "ERR", str(e)[:300]
          for v in versions:
              url = f"https://{handle}.myshopline.com/admin/openapi/{v}/graphql.json"
              s, b = call(url)
              print(f"\n==> version {v} -> HTTP {s}")
              print(b)
          PY
